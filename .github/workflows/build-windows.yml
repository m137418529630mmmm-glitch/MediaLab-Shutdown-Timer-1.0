name: Build Medialab Shutdown Timer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE and MSI
    runs-on: windows-latest

    steps:

      # =====================================================
      # 1. Download repository
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Node.js
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =====================================================
      # 3. Setup Rust
      # =====================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc


      # =====================================================
      # 4. Find the new ZIP
      # =====================================================
      - name: Find project ZIP
        shell: pwsh
        run: |
          Write-Host "Searching for PowerTimer project ZIP..."

          $zip = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Filter "PowerTimer-Pro-Medialab-With-Icon.zip" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $zip) {
            Write-Host "PowerTimer-Pro-Medialab-With-Icon.zip was not found." -ForegroundColor Red

            Write-Host ""
            Write-Host "ZIP files found:"

            Get-ChildItem `
              -Path "$env:GITHUB_WORKSPACE" `
              -Filter "*.zip" `
              -File `
              -Recurse |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 1
          }

          Write-Host "Found:"
          Write-Host $zip.FullName

          "PROJECT_ZIP=$($zip.FullName)" >> $env:GITHUB_ENV


      # =====================================================
      # 5. Extract project
      # =====================================================
      - name: Extract project
        shell: pwsh
        run: |
          $projectPath = "$env:GITHUB_WORKSPACE/app"

          if (Test-Path $projectPath) {
            Remove-Item $projectPath -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $projectPath |
            Out-Null

          Expand-Archive `
            -Path "$env:PROJECT_ZIP" `
            -DestinationPath $projectPath `
            -Force

          Write-Host "Project extracted to:"
          Write-Host $projectPath

          "PROJECT_ROOT=$projectPath" >> $env:GITHUB_ENV


      # =====================================================
      # 6. Verify original project
      # =====================================================
      - name: Verify project
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          $required = @(
            "package.json",
            "src/App.tsx",
            "src/main.tsx",
            "vite.config.ts",
            "public/medialab-logo.png",
            "shutdown_power_icon.ico",
            "src-tauri/icons/icon.ico"
          )

          foreach ($file in $required) {

            if (-not (Test-Path $file)) {
              Write-Host "MISSING: $file" -ForegroundColor Red
              exit 1
            }

            Write-Host "[OK] $file" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "Original project verified successfully."


      # =====================================================
      # 7. Install npm dependencies
      # =====================================================
      - name: Install npm dependencies
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --legacy-peer-deps


      # =====================================================
      # 8. Install Tauri
      # =====================================================
      - name: Install Tauri packages
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install `
            --save-dev `
            @tauri-apps/cli@2 `
            --legacy-peer-deps

          npm install `
            @tauri-apps/api@2 `
            --legacy-peer-deps


      # =====================================================
      # 9. Create Tauri folders
      # =====================================================
      - name: Create Tauri structure
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "src-tauri/src" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "src-tauri/icons" |
            Out-Null


      # =====================================================
      # 10. Create Cargo.toml
      # =====================================================
      - name: Create Cargo.toml
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          @'
          [package]
          name = "medialab-shutdown-timer"
          version = "1.0.0"
          description = "Medialab Shutdown Timer"
          authors = ["MediaLab"]
          edition = "2021"

          [lib]
          name = "medialab_shutdown_timer_lib"
          crate-type = ["staticlib", "cdylib", "rlib"]

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          '@ | Set-Content `
            -Path "src-tauri/Cargo.toml" `
            -Encoding UTF8


      # =====================================================
      # 11. Create build.rs
      # =====================================================
      - name: Create build.rs
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          @'
          fn main() {
              tauri_build::build()
          }
          '@ | Set-Content `
            -Path "src-tauri/build.rs" `
            -Encoding UTF8


      # =====================================================
      # 12. Create Rust backend
      # =====================================================
      - name: Create Rust backend
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |

          @'
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          use std::process::Command;

          #[tauri::command]
          fn execute_action(
              action: String,
              force: bool
          ) -> Result<(), String> {

              match action.as_str() {

                  "shutdown" => {

                      let mut command = Command::new("shutdown.exe");

                      command.args(["/s", "/t", "0"]);

                      if force {
                          command.arg("/f");
                      }

                      command
                          .spawn()
                          .map_err(|e| {
                              format!("Shutdown failed: {}", e)
                          })?;
                  }

                  "restart" => {

                      let mut command = Command::new("shutdown.exe");

                      command.args(["/r", "/t", "0"]);

                      if force {
                          command.arg("/f");
                      }

                      command
                          .spawn()
                          .map_err(|e| {
                              format!("Restart failed: {}", e)
                          })?;
                  }

                  "lock" => {

                      Command::new("rundll32.exe")
                          .arg("user32.dll,LockWorkStation")
                          .spawn()
                          .map_err(|e| {
                              format!("Lock failed: {}", e)
                          })?;
                  }

                  "sleep" => {

                      Command::new("rundll32.exe")
                          .args([
                              "powrprof.dll,SetSuspendState",
                              "0,1,0"
                          ])
                          .spawn()
                          .map_err(|e| {
                              format!("Sleep failed: {}", e)
                          })?;
                  }

                  _ => {
                      return Err(
                          format!(
                              "Unknown action: {}",
                              action
                          )
                      );
                  }
              }

              Ok(())
          }

          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {

              tauri::Builder::default()

                  .invoke_handler(
                      tauri::generate_handler![
                          execute_action
                      ]
                  )

                  .run(
                      tauri::generate_context!()
                  )

                  .expect(
                      "error while running Medialab Shutdown Timer"
                  );
          }
          '@ | Set-Content `
            -Path "src-tauri/src/lib.rs" `
            -Encoding UTF8


          @'
          fn main() {
              medialab_shutdown_timer_lib::run();
          }
          '@ | Set-Content `
            -Path "src-tauri/src/main.rs" `
            -Encoding UTF8


      # =====================================================
      # 13. Create Tauri configuration
      # =====================================================
      - name: Create tauri.conf.json
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |

          @'
          {
            "$schema": "https://schema.tauri.app/config/2",

            "productName": "Medialab-Shutdown Timer",

            "version": "1.0.0",

            "identifier": "com.medialab.shutdown.timer",

            "build": {
              "beforeBuildCommand": "npm run build",
              "frontendDist": "../dist"
            },

            "app": {

              "windows": [
                {
                  "title": "Medialab-Shutdown Timer",
                  "width": 560,
                  "height": 720,
                  "minWidth": 480,
                  "minHeight": 600,
                  "resizable": true
                }
              ],

              "security": {
                "csp": null
              }
            },

            "bundle": {

              "active": true,

              "targets": [
                "nsis",
                "msi"
              ],

              "icon": [
                "icons/icon.ico"
              ],

              "windows": {
                "nsis": {
                  "installMode": "currentUser"
                }
              }
            }
          }
          '@ | Set-Content `
            -Path "src-tauri/tauri.conf.json" `
            -Encoding UTF8


      # =====================================================
      # 14. Create native.ts
      # =====================================================
      - name: Create native API
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |

          @'
          import { invoke } from '@tauri-apps/api/core';

          export type NativeAction =
            | 'shutdown'
            | 'restart'
            | 'lock'
            | 'sleep';

          export async function executeNativeAction(
            action: NativeAction,
            force: boolean = true
          ): Promise<void> {

            await invoke(
              'execute_action',
              {
                action,
                force
              }
            );
          }
          '@ | Set-Content `
            -Path "src/utils/native.ts" `
            -Encoding UTF8


      # =====================================================
      # 15. Connect timer to native Windows action
      # =====================================================
      - name: Connect timer
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |

          $file = "src/App.tsx"

          $content = Get-Content `
            $file `
            -Raw

          # Add native import
          if ($content -notmatch "executeNativeAction") {

            $content = $content.Replace(
              "import { MediaLabLogo } from './components/MediaLabLogo';",
              "import { MediaLabLogo } from './components/MediaLabLogo';`r`nimport { executeNativeAction } from './utils/native';"
            )
          }


          # Add native action when timer reaches zero
          $oldBlock = @"
            clearInterval(timerRef.current!);
            setIsRunning(false);
            sounds.playAlarm();
            setIsLockScreenActive(true);
            return 0;
"@

          $newBlock = @"
            clearInterval(timerRef.current!);
            setIsRunning(false);
            sounds.playAlarm();
            setIsLockScreenActive(true);

            executeNativeAction(actionType, forceKill).catch((error) => {
              console.error('Native Windows action failed:', error);
            });

            return 0;
"@

          if ($content.Contains($oldBlock)) {

            $content = $content.Replace(
              $oldBlock,
              $newBlock
            )

            Write-Host "Timer native action connected successfully." -ForegroundColor Green

          }
          else {

            Write-Host "Timer block was not found." -ForegroundColor Yellow
            Write-Host "The build will continue, but native execution may not be connected."

          }


          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8


      # =====================================================
      # 16. Verify final files
      # =====================================================
      - name: Verify Tauri project
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |

          $required = @(
            "package.json",
            "src/App.tsx",
            "src/main.tsx",
            "src/utils/native.ts",
            "src-tauri/Cargo.toml",
            "src-tauri/build.rs",
            "src-tauri/tauri.conf.json",
            "src-tauri/src/lib.rs",
            "src-tauri/src/main.rs",
            "src-tauri/icons/icon.ico"
          )

          foreach ($file in $required) {

            if (-not (Test-Path $file)) {

              Write-Host ""
              Write-Host "MISSING: $file" -ForegroundColor Red

              exit 1
            }

            Write-Host "[OK] $file" -ForegroundColor Green
          }


      # =====================================================
      # 17. Build React/Vite
      # =====================================================
      - name: Build frontend
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build


      # =====================================================
      # 18. Build Tauri
      # =====================================================
      - name: Build Tauri Windows
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm exec tauri build


      # =====================================================
      # 19. Check EXE
      # =====================================================
      - name: Verify EXE
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |

          $exe = Get-ChildItem `
            "src-tauri/target/release/bundle/nsis" `
            -Filter "*.exe" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $exe) {

            Write-Host "EXE was not generated." -ForegroundColor Red

            exit 1
          }

          Write-Host ""
          Write-Host "EXE generated successfully:" -ForegroundColor Green

          $exe | ForEach-Object {
            Write-Host $_.FullName
          }


      # =====================================================
      # 20. Check MSI
      # =====================================================
      - name: Verify MSI
        shell: pwsh
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |

          $msi = Get-ChildItem `
            "src-tauri/target/release/bundle/msi" `
            -Filter "*.msi" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $msi) {

            Write-Host "MSI was not generated." -ForegroundColor Red

            exit 1
          }

          Write-Host ""
          Write-Host "MSI generated successfully:" -ForegroundColor Green

          $msi | ForEach-Object {
            Write-Host $_.FullName
          }


      # =====================================================
      # 21. Upload installers
      # =====================================================
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Medialab-Shutdown-Timer-Windows
          path: |
            ${{ env.PROJECT_ROOT }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.PROJECT_ROOT }}/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
